spec:
  inputs:
    custom-control-branch:
      description: "Name of the unprotected branch to trigger in the control repo in order to deploy this module into a custom Puppet environment. Only applicable for non-default branches."
      default: ""
    skip-validate-and-test:
      description: "Skip the validate and test stages. Only applicable for non-default branches and when a value for `custom-control-branch` is set."
      default: false
      type: boolean
---
.validate-rules: &validate-rules
  - if: $CI_COMMIT_TAG
    when: never
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"

include:
  - component: $CI_SERVER_FQDN/cbi/pipeline-components/puppet/module-repo@~latest
    inputs:
      custom-control-branch: "$[[ inputs.custom-control-branch ]]"
      skip-validate-and-test: "$[[ inputs.skip-validate-and-test ]]"
  - component: $CI_SERVER_FQDN/cbi/pipeline-components/shellcheck/shellcheck@~latest
    inputs:
      directory: files/
    rules: *validate-rules
